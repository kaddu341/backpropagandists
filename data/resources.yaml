# --- Diffusion and flow matching ---------------------------------------------

- id: nakkiran-2024-step-by-step-diffusion
  title: "Step-by-Step Diffusion: An Elementary Tutorial"
  url: https://arxiv.org/abs/2406.08929
  kind: paper
  topics: [diffusion-flow-matching]
  level: foundational
  year: 2024
  note: "A quick way to get up to speed. You can read it in a day."

- id: mit-6s184-2026
  title: "MIT 6.S184: Flow Matching and Diffusion Models"
  url: https://diffusion.csail.mit.edu/2026/index.html
  kind: course
  topics: [diffusion-flow-matching]
  level: foundational
  year: 2026
  note: "We highly recommend the [lectures](https://www.youtube.com/playlist?list=PL57nT7tSGAAXwjhDYcxEycx5W7YoSrZyt) and the accompanying [course notes](https://diffusion.csail.mit.edu/2026/docs/lecture_notes.pdf) for building intuition."

- id: lipman-2024-flow-matching-guide
  title: "Flow Matching Guide and Code"
  url: https://arxiv.org/abs/2412.06264
  kind: paper
  topics: [diffusion-flow-matching]
  level: intermediate
  year: 2024
  note: "Its [accompanying code](https://github.com/facebookresearch/flow_matching) is much simpler and cleaner than typical research code, which makes it good for learning."

- id: rectified-flow-colab
  title: "Rectified Flow"
  url: https://colab.research.google.com/drive/1LouqFBIC7pnubCOl5fhnFd33-oVJao2J
  kind: notebook
  topics: [diffusion-flow-matching]
  level: foundational
  note: "A minimal flow-matching Colab. It implements rectified flow, from [Flow Straight and Fast](https://arxiv.org/abs/2209.03003) (Liu et al., 2022), on toy Gaussian-mixture data."

# --- Reinforcement learning --------------------------------------------------

