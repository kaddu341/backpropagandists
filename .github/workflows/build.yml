# Build the site on every PR and push to main; deploy to GitHub Pages from main only.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. Superseded PR runs are cancelled; main runs queue instead,
# so a Pages deploy is never cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10 # Python version comes from .python-version
      - uses: actions/setup-node@v7 # for the landing-page physics test
        with:
          node-version: 24
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run sphinx-build -W -b html -d _build/doctrees docs _build/html # doctrees kept out of the published site
      - run: touch _build/html/.nojekyll # belt and braces: _static/ and _sources/ must never meet Jekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the artifact
      id-token: write # prove the deploy comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
